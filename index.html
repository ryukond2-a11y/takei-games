<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>スピード (Speed Card Game)</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #2e7d32;
      color: white;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 { margin-bottom: 10px; }
    .status-panel {
      margin-bottom: 20px;
      font-size: 1.1rem;
    }
    .field {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 20px 0;
    }
    .card-slot {
      width: 80px;
      height: 120px;
      border: 2px dashed rgba(255,255,255,0.5);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: bold;
      background: rgba(0,0,0,0.2);
    }
    .card {
      width: 80px;
      height: 120px;
      background-color: white;
      color: black;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      user-select: none;
      transition: transform 0.1s;
    }
    .card:hover {
      transform: translateY(-5px);
    }
    .card.red { color: #d32f2f; }
    .card.black { color: #111; }

    .hand-area {
      display: flex;
      justify-content: center;
      gap: 10px;
      min-height: 130px;
      margin-top: 10px;
    }
    .deck-info {
      font-size: 0.9rem;
      margin-top: 5px;
      color: #e0e0e0;
    }
    .btn {
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: bold;
      background-color: #ffb300;
      color: #333;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 15px;
    }
    .btn:hover {
      background-color: #ffa000;
    }
    #message {
      font-size: 1.3rem;
      font-weight: bold;
      color: #ffeb3b;
      height: 30px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>スピード</h1>
  <div id="message"></div>

  <div class="status-panel">
    <div>山札残数: <span id="deck-count">0</span>枚</div>
  </div>

  <h2>場札 (台札)</h2>
  <div class="field">
    <div id="field1" class="card-slot"></div>
    <div id="field2" class="card-slot"></div>
  </div>

  <h2>手札</h2>
  <div id="hand" class="hand-area"></div>
  <div class="deck-info">※手札はクリックで場に出せます（±1 の数字）</div>

  <div>
    <button class="btn" onclick="resetGame()">ゲームリセット</button>
  </div>

  <script>
    // ゲームの全体状態（state）
    let state = {
      deck1: [],       // 山札 (常に配列を保持)
      hand1: [],       // 手札
      field1: null,    // 場札1
      field2: null     // 場札2
    };

    const SUITS = ['♠', '♥', '♦', '♣'];

    // デッキ初期化＆シャッフル
    function createDeck() {
      const deck = [];
      for (let suit of SUITS) {
        for (let num = 1; num <= 13; num++) {
          deck.push({ suit, num });
        }
      }
      // シャッフル (Fisher-Yates)
      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
      return deck;
    }

    // ゲーム開始
    function resetGame() {
      const fullDeck = createDeck();

      // 初期化：山札・手札・場札に分配
      state.field1 = fullDeck.pop();
      state.field2 = fullDeck.pop();
      state.hand1 = fullDeck.splice(0, 4); // 最初の4枚
      state.deck1 = fullDeck;              // 残りが山札

      document.getElementById('message').textContent = '';
      refillHand();
      render();
    }

    // 手札を補充する処理 (山札が空・または4枚未満になっても安全に動く)
    function refillHand() {
      // 安全策: deck1 や hand1 が undefined にならないように確保
      if (!Array.isArray(state.deck1)) state.deck1 = [];
      if (!Array.isArray(state.hand1)) state.hand1 = [];

      // 手札が4枚未満かつ、山札が残っている場合のみカードを引き込む
      while (state.hand1.length < 4 && state.deck1.length > 0) {
        const drawnCard = state.deck1.pop();
        if (drawnCard) {
          state.hand1.push(drawnCard);
        }
      }
    }

    // 数字が±1（および1と13のループ）で出せるかチェック
    function isValidMove(cardNum, targetNum) {
      if (!cardNum || !targetNum) return false;
      const diff = Math.abs(cardNum - targetNum);
      return diff === 1 || diff === 12; // 1と13がつながるルール
    }

    // カードを出す処理 (今回のエラー箇所を安全に修正済み)
    function handleSpeedPlay(cardIndex) {
      // 配列の安全性を保証
      const deck1 = Array.isArray(state.deck1) ? state.deck1 : [];
      const hand1 = Array.isArray(state.hand1) ? state.hand1 : [];

      if (cardIndex < 0 || cardIndex >= hand1.length) return;

      const selectedCard = hand1[cardIndex];

      // 場札1に出せるか？
      if (isValidMove(selectedCard.num, state.field1.num)) {
        state.field1 = selectedCard;
        hand1.splice(cardIndex, 1);
      } 
      // 場札2に出せるか？
      else if (isValidMove(selectedCard.num, state.field2.num)) {
        state.field2 = selectedCard;
        hand1.splice(cardIndex, 1);
      } else {
        // 出せないカードの場合
        return;
      }

      state.hand1 = hand1;
      state.deck1 = deck1;

      // 手札を出した後に補充（山札があれば補充され、無ければそのまま減る）
      refillHand();
      render();

      // クリア判定（手札も山札も0枚になったら勝利）
      if (state.hand1.length === 0 && state.deck1.length === 0) {
        document.getElementById('message').textContent = '🎉 クリア！すべてのカードを出し切りました！';
      }
    }

    // DOM描画処理
    function render() {
      // 山札枚数の更新
      const deckCount = Array.isArray(state.deck1) ? state.deck1.length : 0;
      document.getElementById('deck-count').textContent = deckCount;

      // 場札の描画
      renderCardSlot('field1', state.field1);
      renderCardSlot('field2', state.field2);

      // 手札の描画
      const handEl = document.getElementById('hand');
      handEl.innerHTML = '';

      const handList = Array.isArray(state.hand1) ? state.hand1 : [];
      handList.forEach((card, index) => {
        const cardEl = createCardElement(card);
        // クリック時に handleSpeedPlay を実行
        cardEl.onclick = () => handleSpeedPlay(index);
        handEl.appendChild(cardEl);
      });
    }

    function renderCardSlot(id, card) {
      const slot = document.getElementById(id);
      slot.innerHTML = '';
      if (card) {
        slot.appendChild(createCardElement(card));
      }
    }

    function createCardElement(card) {
      const el = document.createElement('div');
      const isRed = card.suit === '♥' || card.suit === '♦';
      el.className = `card ${isRed ? 'red' : 'black'}`;
      
      const suitEl = document.createElement('div');
      suitEl.textContent = card.suit;
      
      const numEl = document.createElement('div');
      numEl.textContent = getNumString(card.num);

      el.appendChild(suitEl);
      el.appendChild(numEl);
      return el;
    }

    function getNumString(num) {
      if (num === 1) return 'A';
      if (num === 11) return 'J';
      if (num === 12) return 'Q';
      if (num === 13) return 'K';
      return num;
    }

    // 初回実行
    resetGame();
  </script>
</body>
</html>
