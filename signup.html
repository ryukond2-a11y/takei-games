<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>新規アカウント作成 - takei-net plus</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: #f4f7f6;
      color: #333333;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .auth-card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 30px 25px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      border: 1px solid #eaeeef;
    }
    .title {
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      margin: 0 0 20px 0;
      color: #1a1a1a;
    }
    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #4a5568;
    }
    .required {
      color: #e53e3e;
      font-weight: bold;
      margin-left: 4px;
    }
    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #cbd5e0;
      background-color: #f8fafc;
      font-size: 14px;
      color: #2d3748;
      transition: all 0.2s ease;
      outline: none;
    }
    input:focus {
      border-color: #3182ce;
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
    }
    .file-input-wrapper {
      position: relative;
      background: #f8fafc;
      border: 1px dashed #cbd5e0;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      transition: background 0.2s;
    }
    .file-input-wrapper:hover {
      background: #edf2f7;
    }
    input[type="file"] {
      display: none;
    }
    .file-label {
      font-size: 13px;
      color: #718096;
      cursor: pointer;
    }
    .error-msg {
      color: #e53e3e;
      font-size: 12px;
      font-weight: bold;
      min-height: 18px;
      margin-bottom: 10px;
      text-align: center;
    }
    .submit-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background-color: #3182ce;
      color: #ffffff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      margin-top: 10px;
    }
    .submit-btn:hover {
      background-color: #2b6cb0;
    }
    .submit-btn:active {
      transform: scale(0.98);
    }
    .link-container {
      margin-top: 18px;
      text-align: center;
    }
    .back-link {
      color: #3182ce;
      font-size: 13px;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }
    .back-link:hover {
      text-decoration: underline;
    }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBdT1yWLsKQ8hyktm0TgCtkc3jLKlOVllY",
      authDomain: "takei-netplus.firebaseapp.com",
      databaseURL: "https://takei-netplus-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "takei-netplus",
      storageBucket: "takei-netplus.firebasestorage.app",
      messagingSenderId: "180284787102",
      appId: "1:180284787102:web:4c9880b6930f323a94ee8f",
      measurementId: "G-HM4ELHCT3V"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const storage = getStorage(app);

    // リダイレクトURLの判定
    const urlParams = new URLSearchParams(window.location.search);
    const redirectTarget = urlParams.get('redirect');

    window.goBack = () => {
      if (redirectTarget) {
        window.location.href = redirectTarget;
      } else {
        window.location.href = "index.html";
      }
    };

    window.updateFileName = (input) => {
      const fileName = input.files[0] ? input.files[0].name : "ファイルを選択されていません";
      document.getElementById("file-name-display").innerText = fileName;
    };

// ログイン処理の関数
window.handleLogin = async () => {
  const loginInput = (document.getElementById("login-id") as HTMLInputElement).value.trim();
  const passwordInput = (document.getElementById("password") as HTMLInputElement).value;
  const errorEl = document.getElementById("error-msg");

  if (!loginInput) {
    if (errorEl) errorEl.innerText = "ログインIDまたはメールアドレスを入力してください";
    return;
  }
  if (!passwordInput) {
    if (errorEl) errorEl.innerText = "パスワードを入力してください";
    return;
  }

  // 💡 ここがポイント！
  // 入力された文字に "@" が含まれていない場合、自動で `@takei.net` を補完する
  let authEmail = loginInput;
  if (!loginInput.includes("@")) {
    authEmail = `${loginInput}@takei.net`;
  }

  try {
    // 補完した email と password でログイン
    await signInWithEmailAndPassword(auth, authEmail, passwordInput);
    console.log("ログイン成功！");
    // ログイン成功後の処理（ゲーム画面へ移動など）
  } catch (err: any) {
    console.error("ログインエラー:", err);
    if (errorEl) {
      errorEl.innerText = "IDまたはパスワードが正しくありません";
    }
  }
};
  </script>
</head>
<body>

  <div class="auth-card">
    <h2 class="title">新規アカウント作成</h2>

    <div id="error-msg" class="error-msg"></div>

    <div class="form-group">
      <label>表示名（名前やニックネームなど）<span class="required">*必須</span></label>
      <input type="text" id="display-name" placeholder="例: たけい 太郎">
    </div>

    <div class="form-group">
      <label>ログインID（半角英数字、DMなどで使用）<span class="required">*必須</span></label>
      <input type="text" id="login-id" placeholder="例: takei123">
    </div>

    <div class="form-group">
      <label>メールアドレス（ない人は空欄でOK！）</label>
      <input type="email" id="email" placeholder="空欄なら自動で仮アドレスを作ります">
    </div>

    <div class="form-group">
      <label>パスワード（6文字以上）<span class="required">*必須</span></label>
      <input type="password" id="password" placeholder="パスワードを入力">
    </div>

    <div class="form-group">
      <label>アイコン（設定しない場合は 🧪 になります）</label>
      <div class="file-input-wrapper" onclick="document.getElementById('icon-file').click()">
        <span id="file-name-display" class="file-label">📁 画像ファイルを選択...</span>
        <input type="file" id="icon-file" accept="image/*" onchange="updateFileName(this)">
      </div>
    </div>

    <button class="submit-btn" onclick="handleSignUp()">登録して始める</button>

    <div class="link-container">
      <span onclick="goBack()" class="back-link">ログイン画面に戻る</span>
    </div>
  </div>

</body>
</html>
